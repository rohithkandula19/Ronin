[project]
name = "ronin-platform"
version = "0.1.0"
description = "Ronin AI OS beta platform plumbing: feature flags, rate limiting, beta access, env validation."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13.5"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_platform"]
