[project]
name = "ronin-storage"
version = "0.1.0"
description = "Ronin Storage: per-org content-addressed blob storage with fail-closed guards and stdlib-only document processing."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13.5"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_storage"]
