[project]
name = "ronin-industry-sdk"
version = "0.1.0"
description = "Ronin AI OS Industry Pack SDK: declarative, fail-closed industry world definitions."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_industry_sdk"]
