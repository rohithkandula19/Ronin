[project]
name = "ronin-agent-patterns"
version = "1.0.0"
description = "Production-grade agent patterns for Claude: ReAct, Planner-Executor, Multi-Agent Supervisor, Reflexion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohith Kandula", email = "rohithkandula937@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "anthropic>=0.121.0",
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/rohithkandula19/Ronin"
Repository = "https://github.com/rohithkandula19/Ronin"
Issues = "https://github.com/rohithkandula19/Ronin/issues"

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_agent_patterns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
