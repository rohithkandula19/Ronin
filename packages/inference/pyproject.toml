[project]
name = "ronin-inference"
version = "0.1.0"
description = "Ronin AI OS inference gateway: routing, cost controls, quotas, append-only usage ledger, kill switch."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_inference"]
