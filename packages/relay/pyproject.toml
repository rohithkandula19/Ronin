[project]
name = "ronin-relay"
version = "1.0.0"
description = "Self-hosted relay for remote Ronin gateway access without opening a port on the laptop. Outbound-only connector, token auth, no arbitrary command execution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohith Kandula", email = "rohithkandula937@gmail.com" }]
maintainers = [{ name = "Rohith Kandula", email = "rohithkandula937@gmail.com" }]
keywords = ["relay", "websocket", "tunnel", "self-hosted", "ronin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Networking",
]
# Caps match versions tested in uv.lock. Ranges so wheels resolve on 3.11-3.13.
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "websockets>=12.0,<16.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
]

[project.scripts]
ronin-relay = "ronin_relay.__main__:main"

[project.urls]
Homepage = "https://github.com/rohithkandula19/Ronin"
Repository = "https://github.com/rohithkandula19/Ronin"
Issues = "https://github.com/rohithkandula19/Ronin/issues"
Changelog = "https://github.com/rohithkandula19/Ronin/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
