[project]
name = "ronin-billing"
version = "0.1.0"
description = "Ronin billing: plans, entitlements, usage metering, subscription state machine, compute-only invoices. Live payments disabled by design."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_billing"]
