[project]
name = "ronin-mcp-servers"
version = "1.0.0"
description = "Reference MCP server templates: Postgres (read-only). Stripe / Linear / Slack / Notion to follow."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohith Kandula", email = "rohithkandula937@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
mcp = ["mcp>=1.28.1"]

[project.urls]
Homepage = "https://github.com/rohithkandula19/Ronin"
Repository = "https://github.com/rohithkandula19/Ronin"
Issues = "https://github.com/rohithkandula19/Ronin/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_mcp_servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
