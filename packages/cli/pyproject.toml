[project]
name = "ronin-cli"
version = "0.58.0"
description = "ronin — a masterless Claude agent CLI: founder briefings, a coding agent, and terminal-native image/video/speech generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.85",
    "tomli-w>=1.0",
    "ronin-agent-patterns",
    "ronin-hardening",
    "ronin-memory",
    "ronin-mcp-servers",
    "ronin-eval-suite",
    "prompt-toolkit>=3.0",
]

[project.scripts]
ronin = "ronin_cli.main:app"
ro = "ronin_cli.main:app"   # short alias

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.uv.sources]
ronin-agent-patterns = { workspace = true }
ronin-hardening = { workspace = true }
ronin-memory = { workspace = true }
ronin-mcp-servers = { workspace = true }
ronin-eval-suite = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
