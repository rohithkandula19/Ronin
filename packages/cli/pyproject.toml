[project]
name = "ronin-cli"
version = "1.0.0"
description = "A masterless Claude-Code-style coding agent for the terminal — provider-agnostic (Claude, Gemini, Cerebras, Groq, Ollama) with MCP, plugins, and evals."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohith Kandula", email = "rohithkandula937@gmail.com" }]
maintainers = [{ name = "Rohith Kandula", email = "rohithkandula937@gmail.com" }]
keywords = [
    "claude", "anthropic", "agent", "coding-agent", "cli", "ai", "llm",
    "claude-code", "mcp", "terminal", "developer-tools", "ollama", "gemini",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
# Caps match the versions actually tested in uv.lock — bump deliberately.
dependencies = [
    "anthropic>=0.100,<1.0",
    "pydantic>=2.5,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<16",
    "textual>=8.0,<9",
    "tomli-w>=1.0,<2",
    "ronin-agent-patterns==1.0.0",
    "ronin-hardening==1.0.0",
    "ronin-memory==1.0.0",
    "ronin-mcp-servers==1.0.0",
    "ronin-eval-suite==1.0.0",
    "prompt-toolkit>=3.0,<4",
]

[project.scripts]
ronin = "ronin_cli.main:app"
ro = "ronin_cli.main:app"   # short alias

[project.urls]
Homepage = "https://github.com/rohithkandula19/Ronin"
Repository = "https://github.com/rohithkandula19/Ronin"
Issues = "https://github.com/rohithkandula19/Ronin/issues"
Changelog = "https://github.com/rohithkandula19/Ronin/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
# Optional web computer-use via Playwright. NOT a core dependency: imported
# lazily, mocked in tests. Enable with:
#   pip install 'ronin-cli[browser]' && playwright install chromium
browser = ["playwright>=1.40,<2"]
# Optional HTTP API mode (`ronin serve`, `ronin dashboard`). NOT a core
# dependency: the serve command guards `uvicorn` at runtime, and `ronin_cli.server`
# imports `fastapi` at module top. Enable with:
#   pip install 'ronin-cli[server]'
server = ["fastapi>=0.110", "uvicorn[standard]>=0.30"]
# Optional fully-local, KEYLESS brain — run a small open coder model IN-PROCESS,
# no API key and no Ollama daemon. NOT a core dependency: EmbeddedProvider imports
# the engine lazily. mlx-lm on Apple Silicon (Metal, zero-build); llama-cpp-python
# elsewhere. Enable with:  pip install 'ronin-cli[local]'
local = [
    "mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "llama-cpp-python>=0.2; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.uv.sources]
ronin-agent-patterns = { workspace = true }
ronin-hardening = { workspace = true }
ronin-memory = { workspace = true }
ronin-mcp-servers = { workspace = true }
ronin-eval-suite = { workspace = true }

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
