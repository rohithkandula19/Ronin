[project]
name = "ronin-research"
version = "0.1.0"
description = "Ronin AI OS research: source-first claims and citations that never fabricate."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13.5",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_research"]
