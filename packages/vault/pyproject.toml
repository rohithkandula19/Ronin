[project]
name = "ronin-vault"
version = "0.1.0"
description = "Ronin Vault: scoped private memory with cross-industry isolation and consent-gated training eligibility."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_vault"]
