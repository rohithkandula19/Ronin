[project]
name = "ronin-support"
version = "0.1.0"
description = "Ronin AI OS support: tickets, incidents, and fail-closed notifications."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_support"]
