[project]
name = "ronin-identity"
version = "0.1.0"
description = "Ronin Identity: users, organizations, memberships, and fail-closed RBAC with org isolation."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13.5"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_identity"]
