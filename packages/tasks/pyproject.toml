[project]
name = "ronin-tasks"
version = "0.1.0"
description = "Ronin AI OS tasks: state machine + in-process scheduler with human approval steps."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_tasks"]
