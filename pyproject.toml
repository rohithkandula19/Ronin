disallow_untyped_decorators = false

# mlx-lm is an Apple-silicon-only optional dependency imported inside a
# function so nothing else in the tree needs it. It ships no stubs and CI is
# Linux, so there is nothing to type against.
[[tool.mypy.overrides]]
module = ["mlx_lm.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
include = [
    "src/ronin/**/*.py",
    "tests/agents/**/*.py",
    "tests/cli/**/*.py",
    "tests/context/**/*.py",
    "tests/core/**/*.py",
    "tests/evalsuite/**/*.py",
    "tests/ext/**/*.py",
    "tests/mcp/**/*.py",
    "tests/obs/**/*.py",
    "tests/persistence/**/*.py",
    "tests/providers/**/*.py",
    "tests/repo/**/*.py",
    "tests/safety/**/*.py",
    "tests/scripts/**/*.py",
    "tests/telemetry/**/*.py",
    "tests/tools/**/*.py",
    "tests/ui/**/*.py",
    "tests/verify/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# <<< generated

# Coverage gate: 85% over ALL of src/ronin. Measured before being written down — the
# reading at the time this landed was 86.0% (14,752 of 17,160 statements), so the gate
# has **1.0 point of headroom** and that is a deliberate, known-tight choice.
#
# What that tightness means, stated plainly rather than discovered later: eleven
# `demo.py` modules totalling 1,506 statements sit at exactly 0%, because every
# subsystem ships a demo command by standing convention and no test runs one. The next
# demo module somebody adds is therefore likelier to trip this gate than a real
# regression is. The alternative — excluding demos and setting 90% — is argued for in
# docs/STACK.md; scope here is "all", so a failing build may mean "add a test for your
# demo" rather than "you broke something", and the fix in that case is a test, not a
# lower number.
#
# `providers/local_adapter.py` is the one genuine low spot at 58%: its generation paths
# need mlx_lm or transformers and CI has neither. That is a real limit of an offline
# suite, not an oversight, and it is why the $0 lane's inference code is the least
# exercised code in the tree.
[tool.coverage.run]
source = ["src/ronin"]
branch = false
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 85
show_missing = false
skip_covered = true
# `if TYPE_CHECKING:` blocks and `@overload` stubs never execute by construction, so
# counting them as uncovered would measure the type annotations rather than the tests.
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
