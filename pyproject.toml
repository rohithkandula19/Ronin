[project]
name = "ro-claude-kit"
version = "0.0.1"
description = "Opinionated reference implementation for shipping production Claude agents in a weekend."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/agent-patterns",
    "packages/eval-suite",
    "packages/memory",
    "packages/mcp-servers",
    "packages/hardening",
    "packages/cli",
    "apps/demo",
    "apps/api",
]

# Root pytest config so `pytest` / `uv run pytest` works from the monorepo root
# (collecting every package). asyncio_mode=auto lets async tests — e.g. the
# Textual TUI queue test — run without a per-test marker.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps"]
