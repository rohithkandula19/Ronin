[project]
name = "ronin"
version = "1.0.0"
description = "ronin — a masterless, terminal-native Claude agent: a Claude-Code-style coding agent on a provider-agnostic agent framework with evals, memory, hardening, and MCP integrations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Deliberately zero hard dependencies. Every optional capability below is reached
# through a lazy import inside the one function that needs it, and degrades with a
# named error rather than an ImportError traceback — so `pip install ronin` gives a
# working agent and each extra adds a capability rather than repairing a broken one.
dependencies = []

[project.optional-dependencies]
# The interactive app. Textual brings Rich transitively, so this is one tree, not
# two; every pure module in `ronin.ui` (reducer, renderers, command parsing) stays
# importable without it, which is why almost all of its tests run on a bare install.
tui = ["textual>=8.0,<9"]
# Multi-language repo maps. `ronin.context.repomap` ships a stdlib-`ast` parser that
# is exact for Python and needs nothing, so this extra widens language coverage
# rather than enabling the feature.
repomap = ["tree-sitter-language-pack>=0.9"]
# Real sockets: provider HTTP/SSE streaming and MCP's network transports. Both
# import httpx inside the sender that needs it, and both are fully tested offline
# against injected transports, so this is only needed to talk to something real.
http = ["httpx>=0.27"]

[tool.uv.workspace]
members = [
    "packages/agent-patterns",
    "packages/eval-suite",
    "packages/memory",
    "packages/mcp-servers",
    "packages/hardening",
    "packages/cli",
    "packages/arcade",
    "packages/dialect",
    "packages/relay",
    "packages/industry-sdk",
    "packages/vault",
    "packages/artifacts",
    "packages/research",
    "packages/tasks",
    "packages/platform",
    "packages/persistence",
    "packages/identity",
    "packages/storage",
    "packages/jobs",
    "packages/observability",
    "packages/support",
    "apps/demo",
    "apps/api",
    "training",
]

# Root pytest config so `pytest` / `uv run pytest` works from the monorepo root
# (collecting every package). asyncio_mode=auto lets async tests — e.g. the
# Textual TUI queue test — run without a per-test marker.
#
# faulthandler_timeout dumps a Python traceback for any test that runs longer
# than the timeout — stdlib-only, no pytest-timeout dependency needed. Catches
# CI hangs that don't reproduce locally (e.g. subprocess deadlock on the
# headless GitHub Actions runner).
[tool.pytest.ini_options]
asyncio_mode = "auto"
# `src` is on the path so the new core contract (src/ronin/core/) is importable
# as `ronin.core.*` without a build step — it is pure stdlib dataclasses and has
# no install-time dependencies. `tests` collects the contract's invariant tests.
pythonpath = ["src"]
testpaths = ["packages", "apps", "tests"]
# `tests/evals/` holds eval *task fixtures*, not tests: small repos the agent is
# pointed at, several of which legitimately contain their own `test_*.py`. Collecting
# them would run another project's tests as if they were ours — and the "add a test"
# category deliberately ships tests that FAIL until the agent fixes the code, so the
# suite would go red by design. `tests/evals/conftest.py` also sets
# `collect_ignore_glob`; this is the belt to that braces, because the two mechanisms
# fail in different ways (a deleted conftest vs. a renamed directory).
norecursedirs = ["tests/evals"]
faulthandler_timeout = 90
markers = [
    "adapter_smoke: LIVE fine-tuned-adapter smoke tests (need mlx-lm + a trained adapter; skipped elsewhere)",
]

# Strict typing + lint for the new src/ronin contract tree. Two dev deps, each
# justified in one line:
#   mypy — the only way "strict typing" is a gate rather than an intention.
#   ruff — lint + format in one fast binary, replacing nothing we already have.
[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
]

# The four lists below have to agree with the filesystem, and a test directory
# missing from mypy's `files` is a directory with no type checking at all — a
# silent gap. `scripts/sync_typecheck_paths.py` regenerates them from disk and
# `--check` fails CI when they drift, so the list is no longer hand-maintained.
# The legacy packages/* tree is not strict-clean yet; this gate covers the new
# contract only, and widens as code moves into src/ronin.
# >>> generated by scripts/sync_typecheck_paths.py — do not edit by hand
[tool.mypy]
python_version = "3.11"
files = [
    "src/ronin",
    "tests/agents",
    "tests/cli",
    "tests/context",
    "tests/core",
    "tests/evalsuite",
    "tests/mcp",
    "tests/persistence",
    "tests/providers",
    "tests/safety",
    "tests/telemetry",
    "tests/tools",
    "tests/ui",
    "tests/verify",
]
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "src:tests/agents:tests/cli:tests/context:tests/core:tests/evalsuite:tests/mcp:tests/persistence:tests/providers:tests/safety:tests/telemetry:tests/tools:tests/ui:tests/verify"

# pytest's @parametrize is an untyped decorator as far as mypy is concerned;
# that is a property of pytest, not a hole in our typing. Enumerated rather
# than wildcarded because mypy rejects a partial-component pattern.
[[tool.mypy.overrides]]
