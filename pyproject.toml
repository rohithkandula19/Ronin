    "test_router",
    "test_safety_command",
    "test_safety_denylist",
    "test_safety_injection",
    "test_safety_integration",
    "test_safety_policy",
    "test_safety_sandbox",
    "test_safety_settings",
    "test_safety_suites",
    "test_search",
    "test_session",
    "test_shell",
    "test_shim",
    "test_task",
    "test_types",
    "test_ui_app",
    "test_ui_commands",
    "test_ui_headless",
    "test_ui_integration",
    "test_ui_keys",
    "test_ui_reduce",
    "test_ui_render",
    "test_ui_textual",
    "test_verify_checkpoints",
    "test_verify_critique",
    "test_verify_integration",
    "test_verify_repair",
    "test_verify_runner",
    "test_verify_spec",
    "ui_harness",
    "verify_harness",
    "wire_harness",
]
disallow_untyped_decorators = false

# mlx-lm is an Apple-silicon-only optional dependency imported inside a
# function so nothing else in the tree needs it. It ships no stubs and CI is
# Linux, so there is nothing to type against.
[[tool.mypy.overrides]]
module = ["mlx_lm.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
include = [
    "src/ronin/**/*.py",
    "tests/agents/**/*.py",
    "tests/cli/**/*.py",
    "tests/context/**/*.py",
    "tests/core/**/*.py",
    "tests/evalsuite/**/*.py",
    "tests/mcp/**/*.py",
    "tests/persistence/**/*.py",
    "tests/providers/**/*.py",
    "tests/safety/**/*.py",
    "tests/telemetry/**/*.py",
    "tests/tools/**/*.py",
    "tests/ui/**/*.py",
    "tests/verify/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
