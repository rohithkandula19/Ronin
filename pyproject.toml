[project]
name = "ronin"
version = "1.0.0"
description = "ronin — a masterless, terminal-native Claude agent: a Claude-Code-style coding agent on a provider-agnostic agent framework with evals, memory, hardening, and MCP integrations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/agent-patterns",
    "packages/eval-suite",
    "packages/memory",
    "packages/mcp-servers",
    "packages/hardening",
    "packages/cli",
    "packages/arcade",
    "packages/dialect",
    "packages/relay",
    "packages/industry-sdk",
    "packages/vault",
    "packages/artifacts",
    "packages/research",
    "packages/tasks",
    "packages/platform",
    "packages/persistence",
    "packages/identity",
    "packages/storage",
    "packages/jobs",
    "packages/observability",
    "packages/support",
    "apps/demo",
    "apps/api",
    "training",
]

# Root pytest config so `pytest` / `uv run pytest` works from the monorepo root
# (collecting every package). asyncio_mode=auto lets async tests — e.g. the
# Textual TUI queue test — run without a per-test marker.
#
# faulthandler_timeout dumps a Python traceback for any test that runs longer
# than the timeout — stdlib-only, no pytest-timeout dependency needed. Catches
# CI hangs that don't reproduce locally (e.g. subprocess deadlock on the
# headless GitHub Actions runner).
[tool.pytest.ini_options]
asyncio_mode = "auto"
# `src` is on the path so the new core contract (src/ronin/core/) is importable
# as `ronin.core.*` without a build step — it is pure stdlib dataclasses and has
# no install-time dependencies. `tests` collects the contract's invariant tests.
pythonpath = ["src"]
testpaths = ["packages", "apps", "tests"]
faulthandler_timeout = 90
markers = [
    "adapter_smoke: LIVE fine-tuned-adapter smoke tests (need mlx-lm + a trained adapter; skipped elsewhere)",
]

# Strict typing + lint for the new src/ronin contract tree. Two dev deps, each
# justified in one line:
#   mypy — the only way "strict typing" is a gate rather than an intention.
#   ruff — lint + format in one fast binary, replacing nothing we already have.
[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.mypy]
python_version = "3.11"
files = ["src/ronin", "tests/core", "tests/providers"]
strict = true
warn_unreachable = true
# Without __init__.py files mypy would name these modules `test_types` rather
# than `tests.core.test_types`, and the per-module override below would not match.
explicit_package_bases = true
# tests/core is on the path so the shared `fakes` module resolves for mypy the
# same way pytest resolves it (test dirs stay non-packages on purpose — making
# them packages breaks collection across the rest of the monorepo).
mypy_path = "src:tests/core:tests/providers"
# The legacy packages/* tree is not strict-clean yet; this gate covers the new
# contract only, and widens as code moves into src/ronin.
# pytest's @parametrize is an untyped decorator as far as mypy is concerned;
# that is a property of pytest, not a hole in our typing.
[[tool.mypy.overrides]]
module = [
    "test_types",
    "test_loop",
    "fakes",
    "test_jsonargs",
    "test_normalize",
    "test_shim",
    "test_adapters",
    "test_golden_streams",
    "test_router",
    "test_assembly",
    "test_accounting",
    "test_bridge",
    "replay",
]
disallow_untyped_decorators = false

# mlx-lm is an Apple-silicon-only optional dependency, imported inside a function
# so that nothing else in the tree needs it. It ships no stubs and CI is Linux, so
# there is nothing to type against — the adapter's own signatures are still checked.
[[tool.mypy.overrides]]
module = ["mlx_lm.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
include = ["src/ronin/**/*.py", "tests/core/**/*.py", "tests/providers/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
