[project]
name = "ronin"
version = "1.0.0"
description = "ronin — a masterless, terminal-native Claude agent: a Claude-Code-style coding agent on a provider-agnostic agent framework with evals, memory, hardening, and MCP integrations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/agent-patterns",
    "packages/eval-suite",
    "packages/memory",
    "packages/mcp-servers",
    "packages/hardening",
    "packages/cli",
    "packages/arcade",
    "packages/dialect",
    "packages/relay",
    "packages/industry-sdk",
    "packages/vault",
    "packages/artifacts",
    "packages/research",
    "packages/tasks",
    "packages/platform",
    "packages/persistence",
    "packages/identity",
    "packages/storage",
    "packages/jobs",
    "packages/observability",
    "packages/support",
    "apps/demo",
    "apps/api",
    "training",
]

# Root pytest config so `pytest` / `uv run pytest` works from the monorepo root
# (collecting every package). asyncio_mode=auto lets async tests — e.g. the
# Textual TUI queue test — run without a per-test marker.
#
# faulthandler_timeout dumps a Python traceback for any test that runs longer
# than the timeout — stdlib-only, no pytest-timeout dependency needed. Catches
# CI hangs that don't reproduce locally (e.g. subprocess deadlock on the
# headless GitHub Actions runner).
[tool.pytest.ini_options]
asyncio_mode = "auto"
# `src` is on the path so the new core contract (src/ronin/core/) is importable
# as `ronin.core.*` without a build step — it is pure stdlib dataclasses and has
# no install-time dependencies. `tests` collects the contract's invariant tests.
pythonpath = ["src"]
testpaths = ["packages", "apps", "tests"]
faulthandler_timeout = 90
markers = [
    "adapter_smoke: LIVE fine-tuned-adapter smoke tests (need mlx-lm + a trained adapter; skipped elsewhere)",
]

# Strict typing + lint for the new src/ronin contract tree. Two dev deps, each
# justified in one line:
#   mypy — the only way "strict typing" is a gate rather than an intention.
#   ruff — lint + format in one fast binary, replacing nothing we already have.
[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
]

# The four lists below have to agree with the filesystem, and a test directory
# missing from mypy's `files` is a directory with no type checking at all — a
# silent gap. `scripts/sync_typecheck_paths.py` regenerates them from disk and
# `--check` fails CI when they drift, so the list is no longer hand-maintained.
# The legacy packages/* tree is not strict-clean yet; this gate covers the new
# contract only, and widens as code moves into src/ronin.
# >>> generated by scripts/sync_typecheck_paths.py — do not edit by hand
[tool.mypy]
python_version = "3.11"
files = [
    "src/ronin",
    "tests/core",
    "tests/providers",
    "tests/tools",
]
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "src:tests/core:tests/providers:tests/tools"

# pytest's @parametrize is an untyped decorator as far as mypy is concerned;
# that is a property of pytest, not a hole in our typing. Enumerated rather
# than wildcarded because mypy rejects a partial-component pattern.
[[tool.mypy.overrides]]
module = [
    "fakes",
    "harness",
    "replay",
    "test_accounting",
    "test_assembly",
    "test_boundaries",
    "test_bridge",
    "test_files",
    "test_golden_streams",
    "test_jsonargs",
    "test_loop",
    "test_net",
    "test_normalize",
    "test_registry",
    "test_resilience",
    "test_router",
    "test_search",
    "test_session",
    "test_shell",
    "test_shim",
    "test_task",
    "test_types",
]
disallow_untyped_decorators = false

# mlx-lm is an Apple-silicon-only optional dependency imported inside a
# function so nothing else in the tree needs it. It ships no stubs and CI is
# Linux, so there is nothing to type against.
[[tool.mypy.overrides]]
module = ["mlx_lm.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
include = [
    "src/ronin/**/*.py",
    "tests/core/**/*.py",
    "tests/providers/**/*.py",
    "tests/tools/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
