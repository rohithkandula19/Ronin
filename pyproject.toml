    "test_ronin_cli_stream",
    "test_ronin_cli_wire",
    "test_ronin_cli_wizard",
    "test_ronin_evals_duel",
    "test_ronin_evals_integration",
    "test_ronin_evals_report",
    "test_ronin_evals_runner",
    "test_ronin_evals_swebench",
    "test_ronin_evals_task",
    "test_ronin_evals_taxonomy",
    "test_ronin_mcp_client",
    "test_ronin_mcp_config",
    "test_ronin_mcp_integration",
    "test_ronin_mcp_jsonrpc",
    "test_ronin_mcp_server",
    "test_ronin_mcp_tools",
    "test_ronin_mcp_transport",
    "test_ronin_telemetry_consent",
    "test_ronin_telemetry_docsite",
