# ronin-adapter-qwen1.5b — pass 2 of 2: DPO on the harvested preference pairs.
#
# Run this ONLY after the SFT pass, and only against its checkpoint: DPO straight onto
# the base model is a different experiment, and the output directory looks identical
# either way. The validator refuses a DPO config with no `resume_adapter` for exactly
# that reason.
#
# Validate:
#   uv run --package ronin-training python -m ronin_training.adapter.config \
#       training/config/adapter_dpo.yaml
#
# Backend note: trl.DPOTrainer (the peft lane, and the lane training/cuda/ already
# drives on a free T4) is the path this config is written for. Preference training in
# mlx-lm is version-dependent — confirm `python -m mlx_lm.lora --help` lists a
# preference/DPO mode before using the mlx projection. The validator emits that as a
# warning on every DPO config; it is not something a machine without mlx can check.

pass: dpo

base_model: Qwen/Qwen2.5-Coder-1.5B-Instruct
base_model_mlx: mlx-community/Qwen2.5-Coder-1.5B-Instruct-4bit
base_model_licence: apache-2.0

# Preference pairs (prompt / chosen / rejected), split by task exactly as the SFT
# corpus is — the same tasks must be held out of both passes, or the SFT holdout leaks
# into the DPO training set.
data_dir: training/data/adapter/preferences
adapter_out: training/adapters/ronin-adapter-qwen1.5b/dpo
resume_adapter: training/adapters/ronin-adapter-qwen1.5b/sft

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  num_layers: -1

train:
  # 1 epoch, specified. Preference pairs overfit fast; the validator enforces it.
  epochs: 1
  # The user specified beta and the epoch count for this pass and nothing else, so the
  # SFT learning rate and schedule are carried over verbatim rather than a second
  # optimiser setting being invented here.
  learning_rate: 1.0e-5
  schedule: cosine
  warmup_ratio: 0.03
  batch_size: 1
  grad_accum: 4
  max_seq_length: 4096
  grad_checkpoint: true
  seed: 0
  steps_per_eval: 50
  save_every: 100
  iters: 0

dpo:
  beta: 0.1

holdout:
  by: task
  fraction: 0.10
  seed: 0

dialect_open_tag: "<ronin:tool_call>"
dialect_close_tag: "</ronin:tool_call>"
