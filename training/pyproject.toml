[project]
name = "ronin-training"
version = "0.1.0"
description = "Ronin volume-driven fine-tuning: turn behavioral volumes into validated MLX JSONL + protocol evals."
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.0",
  "pyyaml>=6.0",
  "ronin-dialect==1.0.0",
]

[project.optional-dependencies]
# On-device Apple-Silicon training. Optional: the dataset builder + evals run
# without it. `pip install -e 'training[mlx]'` on an Apple Silicon Mac.
mlx = ["mlx-lm>=0.20"]
dev = ["pytest>=9.1.1"]

[tool.uv.sources]
ronin-dialect = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin_training"]
