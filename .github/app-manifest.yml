name: Ronin GitHub App
description: Minimal GitHub App for Ronin Mission Control issue import and PR draft status.
url: https://github.com/rohithkandula19/Ronin
hook_attributes:
  url: https://example.com/github/webhook
  active: false
redirect_url: https://github.com/rohithkandula19/Ronin#readme
public: true
default_events:
  - issues
  - issue_comment
  - pull_request
default_permissions:
  contents: read
  issues: read
  metadata: read
  pull_requests: read
