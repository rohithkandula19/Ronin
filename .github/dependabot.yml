# Automated dependency updates. Added in the Phase B dependency-health pass —
# 50 advisories (1 critical, 16 high) had accumulated because nothing opened
# update PRs. Grouped so a weekly batch is one reviewable PR per ecosystem, not
# dozens. Security updates still come as their own PRs regardless of the schedule.
version: 2
updates:
  # Python workspace (uv.lock across all packages + apps).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "python"]

  # Node app (apps/web — pnpm workspace, lockfile at the repo root).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "javascript"]

  # CI action pins.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
