name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Node deps
        run: pnpm install --no-frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-packages

      # No JS linter or Node test suite is wired, so the previous
      # `pnpm run lint` / `pnpm run test` steps were echo no-ops (they printed
      # "no linter wired yet" / "no tests yet" and always passed). They are
      # removed rather than presenting a green gate that checks nothing. The
      # real gate is the Python test suite below. Secret scanning runs as a
      # pre-commit hook (`ronin hook`); a repo-wide CI secret gate is deferred
      # only because the scanner flags its own intentional test fixtures
      # (see docs/security/secret_rotation_checklist.md).

      - name: Install Python deps (with dev groups)
        run: uv sync --all-packages --all-groups

      - name: Test (Python)
        run: |
          uv run --frozen pytest \
            packages/agent-patterns \
            packages/eval-suite \
            packages/memory \
            packages/hardening \
            packages/mcp-servers \
            packages/cli \
            packages/relay \
            apps/demo \
            apps/api \
            training \
            -q

      - name: Build packages (sdist + wheel)
        run: uv build --all-packages

      - name: Standalone clean-install smoke (outside the repo, no source tree)
        run: bash scripts/test_clean_install.sh

      - name: Smoke test ronin CLI
        run: |
          mkdir -p /tmp/ronin-smoke && cd /tmp/ronin-smoke
          uv --project "$GITHUB_WORKSPACE" run ronin init --demo -y
          uv --project "$GITHUB_WORKSPACE" run ronin tools
          uv --project "$GITHUB_WORKSPACE" run ronin doctor
          uv --project "$GITHUB_WORKSPACE" run ronin version
          uv --project "$GITHUB_WORKSPACE" run ronin update --check
          uv --project "$GITHUB_WORKSPACE" run ronin relay --help
          uv --project "$GITHUB_WORKSPACE" run ronin relay connect --help
          uv --project "$GITHUB_WORKSPACE" run ronin telegram --help
