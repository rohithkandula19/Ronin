name: CI

on:
  push:
    branches: [main]
  # No base filter: stacked PRs (base = another feature branch) must get the
  # same matrix — PR #119 shipped with zero Actions runs until it was
  # retargeted to main, which is exactly the gap this closes.
  pull_request:

# Least privilege: CI only reads the repo (tests, build, smoke) — no write scope.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install Python deps (with dev groups)
        run: uv sync --all-packages --all-groups --python ${{ matrix.python }}

      # Full workspace gate: every package + app + training, not a hand-picked
      # subset. Previously CI ran only 10 of 23 package/app paths, so 400+ tests
      # in identity (fail-closed RBAC), vault (cross-industry isolation),
      # billing, observability, etc. could regress green and only surface at the
      # release tag. `pytest packages apps training` mirrors the Makefile and
      # collects the full suite.
      - name: Test (Python — full workspace)
        run: uv run --python ${{ matrix.python }} pytest packages apps training tests -q

  gates:
    name: gates (build · smoke · docs-stats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      # Gate the web app for real (previously ungated): typecheck + production
      # build, so a broken apps/web can't ship green.
      - name: Build web (apps/web)
        run: pnpm --filter @ronin/web build

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python deps (with dev groups)
        run: uv sync --all-packages --all-groups

      # README headline numbers (tests / packages / games) are generated from
      # the repo; fail the build if they drift from the committed README.
      # Strict typing + lint for the src/ronin contract tree (see pyproject).
      # A test directory absent from mypy's `files` is a directory with no type
      # checking at all, and nothing else reports that. This check runs before
      # mypy so the failure names the real cause instead of showing zero errors.
      - name: Type-check paths cover every test dir
        run: uv run python scripts/sync_typecheck_paths.py --check

      - name: Lint (ruff)
        run: uv run ruff check src/ronin tests

      - name: Typecheck (mypy --strict)
        run: uv run mypy

      - name: README stats are current
        run: uv run python scripts/generate_readme_stats.py --check

      # The manifest is what makes a *deleted* eval fixture detectable: the loader
      # refuses a tree that disagrees with it. Generated, so it must be current.
      - name: Eval manifest is current
        run: uv run python scripts/gen_eval_manifest.py --check

      # Two-way proof that every task discriminates: verify.sh must FAIL on the bare
      # fixture and PASS with the author's solution overlaid. A verify.sh that passes
      # on the untouched fixture inflates every score derived from the suite, forever,
      # and nothing about the run looks wrong. ~10s for 118 tasks, so it runs on every
      # push rather than on a schedule nobody reads.
      #
      # This is the *harness* gate. The pass-rate regression gate over the 20
      # `regression_gate` tasks needs a model, so it cannot run here — the suite is
      # required to work offline with no credentials. See docs/EVALS.md for that
      # command; a CI step that silently skipped would be worse than none.
      - name: Eval tasks discriminate (bare fails, solution passes)
        run: uv run python scripts/check_eval_tasks.py --parallel 4 --quiet

      # `ronin eval` is how anyone actually reaches the suite, and for most of its
      # life the runner was complete, tested and unreachable from a command line.
      # --dry-run is the branch that needs no model, no key and no network, so it is
      # the branch CI can prove still works. PYTHONPATH=src because the v2 tree is
      # not the installed console script yet (see docs/ARCHITECTURE.md).
      - name: Eval is reachable from argv (--dry-run, no model)
        env:
          PYTHONPATH: src
        run: |
          uv run python -m ronin eval --dry-run --regression-gate
          uv run python -m ronin duel --dry-run --limit 2
          # A selection that matches nothing must fail rather than report 0/0, which
          # would read as a clean run over an empty suite.
          if uv run python -m ronin eval --dry-run --task no/such-task; then
            echo "expected a nonexistent task id to exit non-zero" >&2
            exit 1
          fi

      - name: Build packages (sdist + wheel)
        run: uv build --all-packages

      - name: Standalone clean-install smoke (outside the repo, no source tree)
        run: bash scripts/test_clean_install.sh

      - name: Smoke test ronin CLI
        run: |
          mkdir -p /tmp/ronin-smoke && cd /tmp/ronin-smoke
          uv --project "$GITHUB_WORKSPACE" run ronin init --demo -y
          uv --project "$GITHUB_WORKSPACE" run ronin util tools
          uv --project "$GITHUB_WORKSPACE" run ronin util doctor
          uv --project "$GITHUB_WORKSPACE" run ronin util version
          uv --project "$GITHUB_WORKSPACE" run ronin update --check
          uv --project "$GITHUB_WORKSPACE" run ronin util relay --help
          uv --project "$GITHUB_WORKSPACE" run ronin util relay connect --help
          uv --project "$GITHUB_WORKSPACE" run ronin util telegram --help
