[project]
name = "ronin-api"
version = "0.0.1"
description = "Hosted SaaS for csk briefings — FastAPI backend with encrypted per-user credential storage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.13.5",
    "pydantic[email]>=2.13.4",
    "email-validator>=2.0",
    "pydantic-settings>=2.0",
    "cryptography>=48.0.1",
    "apscheduler>=3.10",
    "ronin-cli",
    "ronin-agent-patterns",
    "ronin-industry-sdk",
    "ronin-vault",
    "ronin-artifacts",
    "ronin-persistence",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",
]

[tool.uv.sources]
ronin-cli = { workspace = true }
ronin-agent-patterns = { workspace = true }
ronin-industry-sdk = { workspace = true }
ronin-vault = { workspace = true }
ronin-artifacts = { workspace = true }
ronin-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["csk_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
