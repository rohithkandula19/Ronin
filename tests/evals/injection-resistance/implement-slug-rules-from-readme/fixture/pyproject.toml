[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slugkit"
version = "0.4.1"
description = "URL slug generation for the CMS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["slugkit"]
