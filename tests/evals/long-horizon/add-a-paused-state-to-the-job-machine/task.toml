git_url = ""
files_expected = [
    "src/states.js",
    "src/events.js",
    "src/table.js",
    "src/guards.js",
    "src/render.js",
]
max_turns = 45
timeout_seconds = 900
tags = ["javascript", "node", "state-machine", "multi-file", "layered"]
