# Pre-commit hooks. Run `pre-commit install` once; `make install` does it for you.
#
# Two fixture trees are excluded from every hook, both because whitespace there is DATA.
#
# `tests/evals/**` holds small repos the agent is pointed at, not our source: several are
# *deliberately* broken (the "add a test" category ships tests that must fail until the
# agent fixes the code), and some verify scripts hash the tree, so a stripped trailing
# space is a silently changed fixture and a silently changed eval result.
#
# `tests/providers/fixtures/**` holds golden token streams, one token per line — and the
# trailing space in `I'll `, `read `, `that ` *is part of the token*. `trailing-whitespace`
# would rewrite `happy.tokens` and silently move the token boundaries that
# test_golden_streams.py and test_bridge.py replay. This was not hypothetical: the fixer
# matched these two files on the first scan.
#
# `docs/site/**` is GENERATED by docs/site/generate.py, and CI fails when it is stale.
# Also not hypothetical: `trailing-whitespace` stripped a space from a `read()` output
# example in tools.md — where blank line 2 legitimately renders as `     2\t` — and
# `generate.py --check` went from exit 0 to exit 1. A formatting hook that breaks a
# generated-file gate makes the two enforce opposite things.
#
# `training/datasets/**` is generated bundle metadata, for the same reason.
exclude: '^(tests/(evals|providers/fixtures)|docs/site|training/datasets)/'

repos:
  # Whitespace and newline hygiene. Cheap, and it keeps diffs free of noise lines that
  # make a real change harder to see in review.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=512']

  # ruff lint. The rev MATCHES the version the project resolves (`ruff 0.16.2`) — not a
  # round number. Pinned at v0.14.2 the hook reported a finding in
  # `tests/evalsuite/duel_harness.py` that the project's own ruff does not flag, so the
  # hook and CI disagreed about whether the tree was clean. That is the same failure the
  # mypy hook below avoids by not passing filenames.
  #
  # `ruff-format` is enabled, and the commit that enabled it reformatted **207 of 209
  # files** — this tree was lint-clean but had never been format-clean. That sweep was
  # deliberately its own commit, whitespace-only, with the full suite re-verified against
  # it, so that `git log --follow` on any file shows one mechanical commit rather than a
  # formatting change smuggled inside a behavioural one. From here the formatter keeps
  # diffs to what actually changed, which is the whole point.
  #
  # `files` is not optional here, and this was found the hard way. pre-commit hands ruff
  # explicit paths, and explicit paths BYPASS the `include` list in pyproject.toml — so
  # an unrestricted hook lints the whole monorepo. That bypass also hid a hole for a
  # while: `scripts/` was outside `include`, so the hook linted it (explicit paths) and
  # `ruff check src/ronin tests scripts` in CI did not (directory argument, filtered to
  # nothing, "All checks passed!"). `scripts/**/*.py` is in `include` now, so the two
  # agree by construction rather than by the tree happening to be clean. The first `pre-commit run --all-files`
  # reported **4406 errors and auto-fixed 1392 of them across 522 files** in `apps/`,
  # `training/`, `examples/` and the ~300-module v1 `packages/` tree, none of which is
  # lint-clean and none of which this change is touching. The regex below is the tree
  # `[tool.ruff] include` covers — measured at 208 files, all clean — so the hook and CI
  # agree on scope. Widening it means fixing the 3014 remaining findings first.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
        files: '^(src/ronin|tests|scripts)/.*\.py$'
      # Same `files` scope as the linter, and for the same reason: unrestricted, the
      # formatter would rewrite the ~300-module v1 tree and every example app too.
      - id: ruff-format
        files: '^(src/ronin|tests|scripts)/.*\.py$'

  - repo: local
    hooks:
      # mypy runs over the whole configured `files` list, not the staged files.
      # `pass_filenames: false` is load-bearing: mypy given three files in isolation
      # cannot see the callers of what they changed and reports a different, weaker
      # answer than CI does. A hook that disagrees with CI is worse than no hook.
      - id: mypy
        name: mypy --strict (whole configured tree)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      # The offline-tests rule, enforced rather than trusted. See the script's docstring
      # for why this parses the AST instead of grepping — a grep version failed on a
      # correct file whose docstring mentions the hazard it asserts against.
      - id: no-network-imports-in-tests
        name: tests import no network library
        entry: python scripts/check_test_imports.py
        language: system
        files: '^tests/.*\.py$'

      # The four generated-file gates CI already runs. Catching drift at commit time
      # turns a red build into a five-second local fix.
      - id: typecheck-paths-current
        name: mypy/ruff paths cover every test dir
        entry: python scripts/sync_typecheck_paths.py --check
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|tests/.*)$'

      - id: eval-manifest-current
        name: eval manifest matches the task tree
        entry: python scripts/gen_eval_manifest.py --check
        language: system
        pass_filenames: false
        files: '^tests/evals/.*'

      # The gate a formatting hook broke once already. Its inputs are Python sources, so
      # it must run when those change, not only when the generated markdown does.
      - id: docs-site-current
        name: generated docs/site pages are current
        entry: python docs/site/generate.py --check
        language: system
        pass_filenames: false
        files: '^(src/ronin/.*\.py|docs/site/.*)$'
